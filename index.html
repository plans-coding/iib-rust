        /* Loader css code */

        @keyframes moveGradient {
            0% { background-position: 0 0; }

        }

        .delayed-pulse {
            opacity: 0;
            animation: showImage 2s 3s forwards, pulse 1s 2s infinite;
        }

        @keyframes showImage {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }

        <script type="module">
            import init, { page_load, chart_js, user_run_sql } from "./pkg/bewegung.js";
            await init();
            
            document.addEventListener("click", e => {
              const a = e.target.closest("a");
              if (!a) return;
            
              if (a.classList.contains("to-image-viewer")) {
                e.preventDefault();
                iframe.src = a.href;
                dialog.showModal();
                return;
              }
            
              const href = a.getAttribute("href");
              if (!href || !href.startsWith("?")) return;
            
              e.preventDefault();
              history.pushState({}, "", href);
              page_load();
            });
            
            window.addEventListener("popstate", page_load);
            
            window.page_load = page_load;
            window.user_run_sql =  user_run_sql;
            window.load_code_editor = load_code_editor;
            window.setEditorText = setEditorText;
            window.getEditorText = getEditorText;
            window.initiate_spreadhseet = initiate_spreadhseet;
            
            // Image viewer
            const links = document.querySelectorAll('.to-image-viewer');
            const dialog = document.getElementById('image-viewer-dialog');
            const iframe = document.getElementById('image-viewer-content');
            const closeBtn = document.getElementById('close-dialog');
            links.forEach(link => {
              link.addEventListener('click', (e) => {
                e.preventDefault(); // prevent navigation
                iframe.src = link.href; // set iframe src to the link href
                dialog.showModal(); // show dialog
              });
            });
            closeBtn.addEventListener('click', () => {
              dialog.close();
              iframe.src = '';
            });
            
            // Import javascript
            const jsCode_chartjs = chart_js();
            const blob_chartjs = new Blob([jsCode_chartjs], { type: "text/javascript" });
            const url_chartjs = URL.createObjectURL(blob_chartjs);
            await import(url_chartjs);
            URL.revokeObjectURL(url_chartjs);

            await import(url_maplibre);
            URL.revokeObjectURL(url_maplibre);*/

            import {EditorState} from "https://esm.sh/@codemirror/state"
            import {EditorView, keymap, lineNumbers} from "https://esm.sh/@codemirror/view"
            import {defaultKeymap} from "https://esm.sh/@codemirror/commands"
            import { sql, SQLite } from "https://esm.sh/@codemirror/lang-sql"
            import {syntaxHighlighting, defaultHighlightStyle, bracketMatching} from "https://esm.sh/@codemirror/language"
            import {closeBrackets} from "https://esm.sh/@codemirror/autocomplete"

            let view;

            function load_code_editor() {
                const startState = EditorState.create({
                    doc: "SELECT * FROM",
                    extensions: [
                        lineNumbers(),
                        keymap.of(defaultKeymap),
                        syntaxHighlighting(defaultHighlightStyle),
                        bracketMatching(),
                        closeBrackets(),
                        sql({
                            dialect: SQLite,
                            upperCaseKeywords: true
                        })
                    ]
                });

                view = new EditorView({
                    state: startState,
                    parent: document.getElementById('sql-input')
                });
            }

            // Replace entire content
            function setEditorText(text) {
                view.dispatch({
                    changes: {
                        from: 0,
                        to: view.state.doc.length,
                        insert: text
                    }
                });
            }

            function getEditorText() {
                return view.state.doc.toString();
            }


            function initiate_spreadhseet() {
                jspreadsheet(document.getElementById('spreadsheet'));
            }

        function load_trip_map() {
        
            let map = initiate_map();
        
            const mapContainer = document.getElementById('map');
            const mapPinDataContainer = document.getElementById('map-pin-data');
            
            
            const overviewData = JSON.parse(mapPinDataContainer.getAttribute("data-trip-map-overall"));
            const accommodationData = JSON.parse(mapPinDataContainer.getAttribute("data-trip-map-accommodation"));
            const themeColor = mapPinDataContainer.getAttribute("data-theme-color");
            const tripDomain = mapPinDataContainer.getAttribute("data-tripDomain");
        
            const overviewTranslation = mapPinDataContainer.getAttribute("data-translation-overview");
            const accommodationsTranslation = mapPinDataContainer.getAttribute("data-translation-accommodations");
        
        
            const bounds = new maplibregl.LngLatBounds();
        
            map.on('load', () => {
        
                // Prepare marker features
                const overviewFeatures = overviewData.map(loc => {
                    const lat = parseFloat(loc.Latitude);
                    const lng = parseFloat(loc.Longitude);
                    if (isNaN(lat) || isNaN(lng)) return null;
        
                    bounds.extend([lng, lat]);
        
                    return {
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [lng, lat] },
                        properties: { title: loc.MapPin, type: 'overview' }
                    };
                }).filter(f => f);
        
                const accommodationFeatures = accommodationData.map(acc => {
                    if (!acc.AccommodationCoordinates) return null;
                    const coords = acc.AccommodationCoordinates.split(',').map(parseFloat);
                    if (coords.length !== 2 || coords.some(isNaN)) return null;
        
                    bounds.extend([coords[1], coords[0]]); // lng, lat
        
                    return {
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [coords[1], coords[0]] },
                        properties: { 
                            title: acc.Accommodation,
                            date: acc.Date,
                            accuracy: acc.AccommodationCoordinatesAccuracy || '',
                            type: 'accommodation'
                        }
                    };
                }).filter(f => f);
        
                // Add markers as GeoJSON source
                map.addSource('markers', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: [...overviewFeatures, ...accommodationFeatures]
                    }
                });
                
                map.addLayer({
                    id: 'overview-markers',
                    type: 'circle',
                    source: 'markers',
                    filter: ['==', ['get', 'type'], 'overview'],
                    paint: {
                        'circle-radius': 6,
                        'circle-color': '#ffbf00',
                        'circle-stroke-color': '#000',
                        'circle-stroke-width': 1
                    }
                });
                
                if (accommodationFeatures.length > 1) {
                    map.addSource('accommodation-line', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: accommodationFeatures.map(f => f.geometry.coordinates)
                            }
                        }
                    });
        
                    map.addLayer({
                        id: 'accommodation-line-layer',
                        type: 'line',
                        source: 'accommodation-line',
                        layout: { 'line-cap': 'round', 'line-join': 'round' },
                        paint: { 'line-color': themeColor, 'line-width': 3 }
                    });
                }
                
                map.addLayer({
                    id: 'accommodation-markers',
                    type: 'circle',
                    source: 'markers',
                    filter: ['==', ['get', 'type'], 'accommodation'],
                    paint: {
                        'circle-radius': 6,
                        'circle-color': themeColor,
                        'circle-stroke-color': '#000',
                        'circle-stroke-width': 1
                    }
                });
        
        
                const popup = new maplibregl.Popup({
                    closeButton: true,
                    closeOnClick: true
                });
                
                map.on('click', 'overview-markers', (e) => {
                    const feature = e.features[0];
                    const title = feature.properties.title;
                
                    popup
                        .setLngLat(feature.geometry.coordinates)
                        .setHTML(`<b>${title}</b>`)
                        .addTo(map);
                });
                
                map.on('click', 'accommodation-markers', (e) => {
                    const feature = e.features[0];
                    const { title, date, accuracy } = feature.properties;
                
                    popup
                        .setLngLat(feature.geometry.coordinates)
                        .setHTML(`<b>${title}</b><br>${date}<br>${accuracy ? 'Accuracy: ' + accuracy : ''}`)
                        .addTo(map);
                });

        
                if (!bounds.isEmpty()) {
                    map.fitBounds(bounds, { padding: 50, maxZoom: 12, linear: true });
                }
        
            });
        }

        
        function load_contour_map() {
        
            let map = initiate_map();
            
            const mapContainer = document.getElementById('map');
            const mapPinDataContainer = document.getElementById('map-pin-data');
        
            try {
                const rawData = mapPinDataContainer.getAttribute('data-map');
                const jsonData = JSON.parse(rawData);
                
                console.log(jsonData);
        
                // BIND ALL TRIP ACCOMMODATION POINTS TOGETHER
                const allCoordinates = [];
        
                jsonData.forEach(pin => {
                    const { MergedAccommodationCoordinates } = pin;
        
                    const coordinates = MergedAccommodationCoordinates
                        .split('|')
                        .map(coord => {
                            const [lat, lon] = coord.split(',').map(parseFloat);
        
                            if (isNaN(lat) || isNaN(lon)) {
                                console.warn(`Invalid coordinates: ${coord}`);
                                return null;
                            }
        
                            return [lon, lat]; // MapLibre requires [lon, lat]
                        })
                        .filter(Boolean);
        
                    allCoordinates.push(...coordinates);
                });
        
                if (allCoordinates.length === 0) {
                    return;
                }
        
                map.on('load', () => {
                    map.addSource('contour-line', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: allCoordinates
                            }
                        }
                    });
        
                    map.addLayer({
                        id: 'contour-line',
                        type: 'line',
                        source: 'contour-line',
                        paint: {
                            'line-color': '#ffbf00',
                            'line-width': 3
                        }
                    });
        
                    const bounds = allCoordinates.reduce(
                        (b, coord) => b.extend(coord),
                        new maplibregl.LngLatBounds(allCoordinates[0], allCoordinates[0])
                    );
        
                    map.fitBounds(bounds, { padding: 40, maxZoom: 12, linear: true });
                });
        
            } catch (error) {
                console.error('JSON Parse Error:', error);
            }
        }

            try {
                const jsonData = JSON.parse(rawData);
                const bounds = new maplibregl.LngLatBounds();
                const allSubThemes = [];
        
                jsonData.forEach(item => {
                    const regex = /\{([^{}]*?)\|([^{}]*?)\|([^{}]*?)\}/g;
        
                    if (typeof item.AdditionalNotes === 'string') {
                        let match;
                        while ((match = regex.exec(item.AdditionalNotes)) !== null) {
                            const [lat, lon] = match[2]
                                .split(',')
                                .map(v => parseFloat(v.trim()));
        
                            const theme = assetsSettings.Plugin.Theme.mapping
                                .find(t => t.key === match[3].trim());
        
                            allSubThemes.push({

                                ParticipantGroup: item.ParticipantGroup,
                                TravelParticipants: item.TravelParticipants,

                                OverallDestination: item.OverallDestination,
                                ThemePlaceName: match[1].trim(),

        // CHART SCRIPT  -----------------------------------------------------------------------
        
        function initializeChart() {
            const canvas = document.getElementById('stat-trip-overview');
            if (canvas) {
                const chartDataDiv = document.getElementById('stat-trip-overview-chart-data');
        
                const jsonData = JSON.parse(chartDataDiv.getAttribute('data-json'));
                const colorData = JSON.parse(chartDataDiv.getAttribute('data-json-color'));
        
                if (Array.isArray(jsonData) && jsonData.length > 0 && Array.isArray(colorData)) {
                    const aggregatedData = aggregateData(jsonData, colorData);
                    const ctx = canvas.getContext('2d');
                    
                    const existingChart = Chart.getChart(canvas);
                    if (existingChart) {
                        existingChart.destroy();
                    }
        
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: aggregatedData.labels,
                            datasets: aggregatedData.datasets
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: {
                                    stacked: true
                                },
                                y: {
                                    stacked: true,
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                } else {
                    console.error("Invalid or empty jsonData or colorData:", jsonData, colorData);
                }
            } else {
                setTimeout(initializeChart, 100);
            }
        }
        
        // Function to aggregate data by Year and DomainAbbreviation
        function aggregateData(jsonData, colorData) {
            const dataMap = {};
        
            // Initialize the dataMap with years and domain abbreviations
            jsonData.forEach(item => {
                const year = item.Year;
                const domainDesc = item.DomainDescription;
                const count = item.AbbreviationCount;
        
                if (!dataMap[year]) {
                    dataMap[year] = {};
                }
                if (!dataMap[year][domainDesc]) {
                    dataMap[year][domainDesc] = 0;
                }
                dataMap[year][domainDesc] += count;
            });
        
            // Prepare labels and datasets for chart
            const years = Object.keys(dataMap);
            const domainAbbrs = new Set(jsonData.map(item => item.DomainDescription));
        
            // Map the colors to their domain abbreviations
            const domainColors = colorData.reduce((acc, { DomainDescription, Color }) => {
                acc[DomainDescription] = Color;
                return acc;
            }, {});
        
            const datasets = Array.from(domainAbbrs).map(domain => {
                return {
                    label: domain,
                    data: years.map(year => dataMap[year][domain] || 0),
                    backgroundColor: domainColors[domain] || "#cccccc",
                    borderColor: domainColors[domain] || "#cccccc",
                    borderWidth: 1
                };
            });
        
            return {
                labels: years,
                datasets: datasets
            };
        }

        async function getCoverPhoto(path, immichApiUrl, immichApiKey) {
            try {
                const response = await fetch(JSON.parse(immichApiUrl) + 'search/metadata', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': JSON.parse(immichApiKey)
                    },
                    body: JSON.stringify({ originalPath: path })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();

                if (!data.assets || !data.assets.items || data.assets.items.length === 0) {
                    console.warn('No assets found for path', path);
                    return null;
                }

                const coverPhotoUrl = JSON.parse(immichApiUrl) + "assets/" + data.assets.items[0].id + "/thumbnail?size=preview";
                return coverPhotoUrl; // <- This now returns to applyTripCoverPhotos
            } catch (error) {
                console.error('Fetch error:', error);
                return null;
            }
        }

        
        async function applyTripCoverPhotos(immichApiUrl, immichApiKey) {
            const cards = document.querySelectorAll(
                '.explore-cover[data-trip-cover-photo-path]'
            );

            for (const card of cards) {
                const path = card.dataset.tripCoverPhotoPath;
                if (!path) continue;



                try {
                    const url = await getCoverPhoto(path, immichApiUrl, immichApiKey);
                    if (!url) continue;

                    card.style.backgroundImage = `url("${url}")`;
                    card.style.backgroundSize = 'cover';
                    card.style.backgroundPosition = 'center';
                    card.style.backgroundRepeat = 'no-repeat';
                } catch (err) {
                    console.warn('Failed to load cover photo for', path, err);
                }
            }
        }
