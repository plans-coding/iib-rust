            // CODE EDITOR  -----------------------------------------------------------------------

            let cmView;

            function load_code_editor(newCode = null) {
                const container = document.getElementById("code_editor");
                if (!container) return;

                // Destroy old editor if DOM was replaced
                if (cmView && cmView.dom.parentNode !== container) {
                    cmView.destroy();
                    cmView = null;
                }

                // Create editor if it doesn't exist
                if (!cmView) {
                    cmView = cm6.load().textarea(container, {
                        dark: false,
                        sql: { dialect: "sqlite" },
                        completion: true
                    });
                    console.log("Editor created");
                }

                // Apply new code if provided
                if (typeof newCode === "string") {
                    cmView.dispatch({
                        changes: { from: 0, to: cmView.state.doc.length, insert: newCode }
                    });
                    console.log("Content updated");
                }
                console.log(cmView);
            }

            function get_code_editor() {
                if (!cmView) return ""; // editor not initialized yet
                return cmView.state.doc.toString();
            }

        </script>

            async function load_query_from_file(path) {
                const res = await fetch(path);
                const text = await res.text();
                load_code_editor(text);
            }

            async function custom_queries() {
                const response = await fetch("personal/custom-queries.txt");
                const text = await response.text();

                const html = text
                    .split("\n")
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(txt_row => {
                        const label = txt_row.split("/").pop();
                        return `
                            <div style="cursor:pointer;"
                                onclick="load_query_from_file('personal/${txt_row}');">
                                ${label}
                            </div>
                        `;
                    })
                    .join("");

                document.getElementById("custom_queries").innerHTML = html;
            }

            function refreshTable(tabulator_data) {

                document.getElementById("run_query_button").classList.add("inactivated-button");
                document.getElementById("loading-overlay").style.display = "block";

                if (!tabulator_data || tabulator_data.length === 0) {
                    sqlOutputTable.setColumns([]);
                    sqlOutputTable.setData([]);
                    return;
                }

                const rownumColumn = {
                    title: "",
                    formatter: "rownum",
                    frozen: true,
                    width: 50,
                    hozAlign: "center",
                    headerSort: false,
                };

                const columns = tabulator_data.columns;
                const rows = tabulator_data.rows;

                const dataColumns = columns.map(colName => ({
                    title: colName,
                    field: colName,
                    resizable: true,
                    headerSort: true,
                    headerFilter:"input"
                }));

                const allColumns = [rownumColumn, ...dataColumns];

                const objectRows = rows.map((row, index) => {
                    const obj = {};
                    columns.forEach((colName, i) => {
                        obj[colName] = row[i];
                    });
                    obj["_rownum"] = index + 1;
                    return obj;
                });

                sqlOutputTable.setColumns(allColumns);

                setTimeout(() => {
                    sqlOutputTable.setData(objectRows);
                    document.getElementById("loading-overlay").style.display = "none";
                    document.getElementById("run_query_button").classList.remove("inactivated-button");
                }, 50);

            }



        // MAP SCRIPT  -----------------------------------------------------------------------
        
        function initiate_map() {
            const map = new maplibregl.Map({
              container: "map",
              style: {
                version: 8,
                sources: {
                  "osm-tiles": {
                    type: "raster",
                    tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                    tileSize: 256,
                    attribution: "© OpenStreetMap contributors"
                  }
                },
                layers: [{
                  id: "osm-tiles",
                  type: "raster",
                  source: "osm-tiles",
                  minzoom: 0,
                  maxzoom: 19
                }]
              },
              zoom: 8,
              attributionControl: false
            });
        
            map.addControl(new maplibregl.NavigationControl(), "top-right");
            map.addControl(new maplibregl.FullscreenControl(), "top-right");
            
            return map
        }
        
        
        function load_trip_map() {
        
            let map = initiate_map();
        
            const mapContainer = document.getElementById('map');
            const mapPinDataContainer = document.getElementById('map-pin-data');
            
            
            const overviewData = JSON.parse(mapPinDataContainer.getAttribute("data-trip-map-overall"));
            const accommodationData = JSON.parse(mapPinDataContainer.getAttribute("data-trip-map-accommodation"));
            const themeColor = mapPinDataContainer.getAttribute("data-theme-color");
            const tripDomain = mapPinDataContainer.getAttribute("data-tripDomain");
        
            const overviewTranslation = mapPinDataContainer.getAttribute("data-translation-overview");
            const accommodationsTranslation = mapPinDataContainer.getAttribute("data-translation-accommodations");
        
        
            const bounds = new maplibregl.LngLatBounds();
        
            map.on('load', () => {
        
                // Prepare marker features
                const overviewFeatures = overviewData.map(loc => {
                    const lat = parseFloat(loc.Latitude);
                    const lng = parseFloat(loc.Longitude);
                    if (isNaN(lat) || isNaN(lng)) return null;
        
                    bounds.extend([lng, lat]);
        
                    return {
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [lng, lat] },
                        properties: { title: loc.MapPin, type: 'overview' }
                    };
                }).filter(f => f);
        
                const accommodationFeatures = accommodationData.map(acc => {
                    if (!acc.AccommodationCoordinates) return null;
                    const coords = acc.AccommodationCoordinates.split(',').map(parseFloat);
                    if (coords.length !== 2 || coords.some(isNaN)) return null;
        
                    bounds.extend([coords[1], coords[0]]); // lng, lat
        
                    return {
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [coords[1], coords[0]] },
                        properties: { 
                            title: acc.Accommodation,
                            date: acc.Date,
                            accuracy: acc.AccommodationCoordinatesAccuracy || '',
                            type: 'accommodation'
                        }
                    };
                }).filter(f => f);
        
                // Add markers as GeoJSON source
                map.addSource('markers', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: [...overviewFeatures, ...accommodationFeatures]
                    }
                });
                
                map.addLayer({
                    id: 'overview-markers',
                    type: 'circle',
                    source: 'markers',
                    filter: ['==', ['get', 'type'], 'overview'],
                    paint: {
                        'circle-radius': 6,
                        'circle-color': '#ffbf00',
                        'circle-stroke-color': '#000',
                        'circle-stroke-width': 1
                    }
                });
                
                if (accommodationFeatures.length > 1) {
                    map.addSource('accommodation-line', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: accommodationFeatures.map(f => f.geometry.coordinates)
                            }
                        }
                    });
        
                    map.addLayer({
                        id: 'accommodation-line-layer',
                        type: 'line',
                        source: 'accommodation-line',
                        layout: { 'line-cap': 'round', 'line-join': 'round' },
                        paint: { 'line-color': themeColor, 'line-width': 3 }
                    });
                }
                
                map.addLayer({
                    id: 'accommodation-markers',
                    type: 'circle',
                    source: 'markers',
                    filter: ['==', ['get', 'type'], 'accommodation'],
                    paint: {
                        'circle-radius': 6,
                        'circle-color': themeColor,
                        'circle-stroke-color': '#000',
                        'circle-stroke-width': 1
                    }
                });
        
        
                const popup = new maplibregl.Popup({
                    closeButton: true,
                    closeOnClick: true
                });
                
                map.on('click', 'overview-markers', (e) => {
                    const feature = e.features[0];
                    const title = feature.properties.title;
                
                    popup
                        .setLngLat(feature.geometry.coordinates)
                        .setHTML(`<b>${title}</b>`)
                        .addTo(map);
                });
                
                map.on('click', 'accommodation-markers', (e) => {
                    const feature = e.features[0];
                    const { title, date, accuracy } = feature.properties;
                
                    popup
                        .setLngLat(feature.geometry.coordinates)
                        .setHTML(`<b>${title}</b><br>${date}<br>${accuracy ? 'Accuracy: ' + accuracy : ''}`)
                        .addTo(map);
                });

        
                if (!bounds.isEmpty()) {
                    map.fitBounds(bounds, { padding: 50, maxZoom: 12, linear: true });
                }
        
            });
        }

        
        function load_contour_map() {
        
            let map = initiate_map();
            
            const mapContainer = document.getElementById('map');
            const mapPinDataContainer = document.getElementById('map-pin-data');
        
            try {
                const rawData = mapPinDataContainer.getAttribute('data-map');
                const jsonData = JSON.parse(rawData);
                
                console.log(jsonData);
        
                // BIND ALL TRIP ACCOMMODATION POINTS TOGETHER
                const allCoordinates = [];
        
                jsonData.forEach(pin => {
                    const { MergedAccommodationCoordinates } = pin;
        
                    const coordinates = MergedAccommodationCoordinates
                        .split('|')
                        .map(coord => {
                            const [lat, lon] = coord.split(',').map(parseFloat);
        
                            if (isNaN(lat) || isNaN(lon)) {
                                console.warn(`Invalid coordinates: ${coord}`);
                                return null;
                            }
        
                            return [lon, lat]; // MapLibre requires [lon, lat]
                        })
                        .filter(Boolean);
        
                    allCoordinates.push(...coordinates);
                });
        
                if (allCoordinates.length === 0) {
                    return;
                }
        
                map.on('load', () => {
                    map.addSource('contour-line', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: allCoordinates
                            }
                        }
                    });
        
                    map.addLayer({
                        id: 'contour-line',
                        type: 'line',
                        source: 'contour-line',
                        paint: {
                            'line-color': '#ffbf00',
                            'line-width': 3
                        }
                    });
        
                    const bounds = allCoordinates.reduce(
                        (b, coord) => b.extend(coord),
                        new maplibregl.LngLatBounds(allCoordinates[0], allCoordinates[0])
                    );
        
                    map.fitBounds(bounds, { padding: 40, maxZoom: 12, linear: true });
                });
        
            } catch (error) {
                console.error('JSON Parse Error:', error);
            }
        }

        function load_theme_map() {
        
        
            let map = initiate_map();
        
            const mapContainer = document.getElementById('map');
            const mapPinDataContainer = document.getElementById('map-pin-data');
            const rawData = mapPinDataContainer.getAttribute('data-map');
            const assetsSettings = JSON.parse(
                mapPinDataContainer.getAttribute("data-settings-assets")
            );
        
        
            if (!rawData) return;
        
            try {
                const jsonData = JSON.parse(rawData);
                const bounds = new maplibregl.LngLatBounds();
                const allSubThemes = [];
        
                jsonData.forEach(item => {
                    const regex = /\{([^{}]*?)\|([^{}]*?)\|([^{}]*?)\}/g;
        
                    if (typeof item.AdditionalNotes === 'string') {
                        let match;
                        while ((match = regex.exec(item.AdditionalNotes)) !== null) {
                            const [lat, lon] = match[2]
                                .split(',')
                                .map(v => parseFloat(v.trim()));
        
                            const theme = assetsSettings.Plugin.Theme.mapping
                                .find(t => t.key === match[3].trim());
        
                            allSubThemes.push({
                                InnerId: item.InnerId,
                                OuterId: item.OuterId,
                                ParticipantGroup: item.ParticipantGroup,
                                TravelParticipants: item.TravelParticipants,
                                Date: item.Date,
                                OverallDestination: item.OverallDestination,
                                ThemePlaceName: match[1].trim(),
                                ThemeLat: lat,
                                ThemeLon: lon,
                                ThemeAbbr: match[3].trim(),
                                ThemeName: theme?.label ?? ''
                            });
                        }
                    }
                });
        
                console.log("allSubThemes", allSubThemes);
        
                allSubThemes.forEach(item => {
                    const { ThemeLat: lat, ThemeLon: lon } = item;
        
                    const popupContent = `
                        <a class="link-color"
                           href="https://www.google.com/maps/?q=${lat},${lon}"
                           target="_blank">
                           <b>${item.ThemePlaceName}</b>
                        </a><br>
                        ${item.ParticipantGroup} ${item.TravelParticipants}<br>
                        ${item.Date}<br>
                        <a href="?path=trip:${item.OuterId}" class="iib-map-ref" data-iib-tripDomain="${item.InnerId.charAt(0)}">${item.OuterId} ${item.OverallDestination}</a>
                    `;
        
                    const el = document.createElement('div');
                    el.className = 'custom-icon';
                    el.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="32" height="32"
                             viewBox="0 0 16 16">
                          <path class="themePinColor"
                                d="M2 15.5V2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.74.439L8 13.069l-5.26 2.87A.5.5 0 0 1 2 15.5M8.16 4.1a.178.178 0 0 0-.32 0l-.634 1.285a.18.18 0 0 1-.134.098l-1.42.206a.178.178 0 0 0-.098.303L6.58 6.993c.042.041.061.1.051.158L6.39 8.565a.178.178 0 0 0 .258.187l1.27-.668a.18.18 0 0 1 .165 0l1.27.668a.178.178 0 0 0 .257-.187L9.368 7.15a.18.18 0 0 1 .05-.158l1.028-1.001a.178.178 0 0 0-.098-.303l-1.42-.206a.18.18 0 0 1-.134-.098z"/>
                        </svg>
                    `;
        
                    const popup = new maplibregl.Popup({ offset: 25 })
                        .setHTML(popupContent);
        
                    new maplibregl.Marker({ element: el })
                        .setLngLat([lon, lat])
                        .setPopup(popup)
                        .addTo(map);
        
                    bounds.extend([lon, lat]);
                });
        
                if (allSubThemes.length > 0) {
                    map.fitBounds(bounds, { padding: 50, maxZoom: 12, linear: true });
                }
        
                console.log("MapLibre map initialized with auto-zoom");
        
            } catch (err) {
                console.error("JSON Parse Error:", err);
            }
        }

        function initializeChart() {
            const canvas = document.getElementById('stat-trip-overview');
            if (canvas) {
                const chartDataDiv = document.getElementById('stat-trip-overview-chart-data');
        
                const jsonData = JSON.parse(chartDataDiv.getAttribute('data-json'));
                const colorData = JSON.parse(chartDataDiv.getAttribute('data-json-color'));

                const barColor = getComputedStyle(document.documentElement)
                .getPropertyValue('--color-filter')
                .trim();
        
                if (Array.isArray(jsonData) && jsonData.length > 0 && Array.isArray(colorData)) {
                    const aggregatedData = aggregateData(jsonData, colorData);
                    const ctx = canvas.getContext('2d');
                    
                    const existingChart = Chart.getChart(canvas);
                    if (existingChart) {
                        existingChart.destroy();
                    }
        
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: aggregatedData.labels,
                            datasets: aggregatedData.datasets
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: {
                                    stacked: true,
                                    ticks: {
                                    color: barColor
                                }
                                },
                                y: {
                                    stacked: true,
                                    beginAtZero: true,
                                    ticks: {
                                    color: barColor
                                }
                                }
                            },
                        plugins: {
                            legend: {
                                labels: {
                                color: barColor
                                }
                            }
                        }
                        }
                    });
                } else {
                    console.error("Invalid or empty jsonData or colorData:", jsonData, colorData);
                }
            } else {
                setTimeout(initializeChart, 100);
            }
        }
        
        // Function to aggregate data by Year and DomainAbbreviation
        function aggregateData(jsonData, colorData) {
            const dataMap = {};
        
            // Initialize the dataMap with years and domain abbreviations
            jsonData.forEach(item => {
                const year = item.Year;
                const domainDesc = item.DomainDescription;
                const count = item.AbbreviationCount;
        
                if (!dataMap[year]) {
                    dataMap[year] = {};
                }
                if (!dataMap[year][domainDesc]) {
                    dataMap[year][domainDesc] = 0;
                }
                dataMap[year][domainDesc] += count;
            });
        
            // Prepare labels and datasets for chart
            const years = Object.keys(dataMap);
            const domainAbbrs = new Set(jsonData.map(item => item.DomainDescription));
        
            // Map the colors to their domain abbreviations
            const domainColors = colorData.reduce((acc, { DomainDescription, Color }) => {
                acc[DomainDescription] = Color;
                return acc;
            }, {});
        
            const datasets = Array.from(domainAbbrs).map(domain => {
                return {
                    label: domain,
                    data: years.map(year => dataMap[year][domain] || 0),
                    backgroundColor: domainColors[domain] || "#cccccc",
                    borderColor: domainColors[domain] || "#cccccc",
                    borderWidth: 1
                };
            });
        
            return {
                labels: years,
                datasets: datasets
            };
        }
        
        // Function to initialize the second chart (for overnights)
        function initializeChartOvernights() {
            const canvasOvernights = document.getElementById('stat-trip-overnights');
        
            // If the canvas is found, initialize the chart
            if (canvasOvernights) {
                const chartDataOvernights = JSON.parse(document.getElementById("stat-trip-overnights-chart-data").getAttribute('data-json'));
                const ctxOvernights = canvasOvernights.getContext('2d');
        
                const labels = chartDataOvernights.map(item => item.AccommodationCountry);
                const data = chartDataOvernights.map(item => item.Overnights);
                
                const existingChart = Chart.getChart(canvasOvernights);
                if (existingChart) {
                    existingChart.destroy();
                }
        
                const barColor = getComputedStyle(document.documentElement)
                .getPropertyValue('--color-filter')
                .trim();

                new Chart(ctxOvernights, {
                    type: 'bar',
                    data: {
                        labels: labels, // Labels for the x-axis
                        datasets: [{
                            label: '',
                            data: data, // Data values
                            backgroundColor: barColor,
                            color: barColor,
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        indexAxis: 'y',
                        scales: {
                            y: {
                                beginAtZero: true,
                                    ticks: {
                                    color: barColor
                                }
                            },
                            x: {
                                    ticks: {
                                    color: barColor
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false  // Hide the legend
                            }
                    }
        
                }
                });
        
            } else {
                // If the canvas is not found yet, retry after a short delay
                setTimeout(initializeChartOvernights, 100);
            }
        }

        function initialize_theme_color() {
            const button = document.getElementById('themeToggle');

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
            }

            button.addEventListener('click', () => {
                document.body.classList.toggle('dark');

                // Save current theme to localStorage
                if (document.body.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }

            });
        }

        async function get_cover_album_list(immichUrl, immichCoverAlbumId) {
            const response = await fetch(immichUrl + "api/albums/" + immichCoverAlbumId);

            if (!response.ok) {
                throw new Error("Failed to fetch album: " + response.status + " " + response.statusText);
            }

            return response.json();

        }


        async function add_photo_to_album(immichUrl, immichCoverAlbumId, assetIds) {
            const response = await fetch(immichUrl + "api/albums/" + immichCoverAlbumId + "/assets", {
                method: "PUT",
                headers: {
                "Content-Type": "application/json"
                },
                body: JSON.stringify({
                ids: assetIds
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                "Failed to add assets to album: " +
                response.status + " " +
                response.statusText + " - " +
                errorText
                );
            }

            return response.json();
        }

        async function searchMissingCoverPhotos(immichUrl, missingCoverPhotos) {
            const results = [];

            for (const item of missingCoverPhotos) {
                const originalPath = item.CoverPhoto;

                try {
                    const searchResult = await searchByOriginalPath(
                        immichUrl,
                        originalPath
                    );

                    const assetId = searchResult?.assets?.items?.[0]?.id;
                    if (assetId) {
                        results.push({
                            coverPhoto: originalPath,
                            outerId: item.OuterId,
                            assetId
                        });
                    }
                } catch (err) {
                    console.error(err);
                    /*results.push({
                        coverPhoto: originalPath,
                        outerId: item.OuterId,
                        error: err.message
                    });*/
                }
            }

            return results;
        }

        // RUN THIS TO SAVE IMMICH ALBUM TO OPFS
        async function save_album_covers_ids2OPFS(immichUrl, immichCoverAlbumId) {

            const cover_albums_db_text =
                document.getElementById("coverPhotoOriginalPaths").textContent;

            const cover_albums_db = JSON.parse(cover_albums_db_text);

            const cover_albums_response = await get_cover_album_list(
                immichUrl,
                immichCoverAlbumId
            );

            const outerIdToAssetId = Object.fromEntries(
                cover_albums_db
                    .map(dbItem => {
                        const asset = cover_albums_response.assets.find(
                            a => a.originalPath === dbItem.CoverPhoto
                        );
                        return asset ? [dbItem.OuterId, asset.id] : null;
                    })
                    .filter(Boolean)
            );

            await (await (await navigator.storage.getDirectory())
            .getFileHandle("cover_photos.json", { create: true }))
            .createWritable()
            .then(w => (w.write(JSON.stringify(outerIdToAssetId, null, 2)), w.close()));


        }
