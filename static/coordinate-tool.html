<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coordinate Tool - Immer in Bewegung</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6f757e" id="themeColorMeta">
    <meta name="msapplication-navbutton-color" content="#6f757e">

    <link rel="shortcut icon" href="../static/images/frog.svg" />

    <!-- MapLibre GL -->
        <script src='../bundle/maplibre-gl/maplibre-gl.js'></script>
        <link href='../bundle/maplibre-gl/maplibre-gl.css' rel='stylesheet' /></link>

    <!-- MapLibre Geocoder -->
    <link
        href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css"
        rel="stylesheet"
    />
    <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>

    <style>
        @font-face {
            font-family: 'Cairo';
            src: url('../bundle/fonts/Cairo-VariableFont_slnt,wght.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Righteous';
            src: url('../bundle/fonts/Righteous-Regular.ttf') format('truetype');
        }

        a { text-decoration: none; color: #fff; }

        html {
            height: 100%;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial,
                sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
                "Segoe UI Symbol", "Noto Color Emoji";
        }

        body { margin: 0; padding: 0; height: 100%; }

        .immer-in-font-uc {
            font-family: 'Cairo', sans-serif;
            text-transform: uppercase;
            font-size: 1.2em;
        }

        .bewegung-font-uc {
            font-family: 'Righteous', sans-serif;
            text-transform: uppercase;
            font-size: 1.2em;
        }

        .maplibregl-ctrl-geocoder input {
            font-size: 16pt;
            font-family: Cairo;
        }

        .maplibregl-ctrl-geocoder,
        .form-control {
            border: 3pt solid #1d655e !important;
        }
        .btn {cursor:pointer;}
    </style>
</head>

<body>

<div style="display:flex;flex-direction:column;height:100vh;background-color:#1d655e;color:#fff;">

    <div style="height:100%;flex-grow:1;position:relative;">
        <div
            style="
                position:absolute;
                display:flex;
                gap:5pt;
                bottom:10pt;
                left:10pt;
                flex-wrap:wrap;
                margin-right:10pt;
                z-index:10000;
            "
        >
            <input
                type="text"
                id="cityName"
                style="flex:1;font-size:20pt;padding:5pt;border:3pt solid grey;"
                class="form-control"
                value=""
                placeholder="Enter pin name"
                oninput="updateCoordField()"
            />

            <input
                type="text"
                id="markedCoordinate"
                style="flex:1;font-size:20pt;padding:5pt;border:3pt solid grey;"
                class="form-control"
                disabled
            />

            <button
                class="btn"
                style="align-items:center;font-size:1.2em;background-color:#1d655e;color:#fff;"
                onclick="copyToClipboard();"
                id="lang-coordTool-copy-coordinates"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/>
                </svg>
            </button>

		

            <button class="btn" style="width:100px;align-items:center;font-size:1.2em;background-color:#77065d;color:#fff;"
                onclick="document.getElementById('all_items').value += document.getElementById('markedCoordinate').value + '\n';" id="lang-coordTool-copy-coordinates"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-down-square" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 2a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1zM0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm8.5 2.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z"/>
                </svg>
		</button>

		<textarea id="all_items" style="font-size:14pt;width:100%;height:200px;" class="form-control"></textarea>
        </div>

        <div id="coordMap" style="width:100%;height:100%;cursor:pointer;"></div>
    </div>
</div>

<script>
    let lat;
    let lng;
    let marker;

    const map = new maplibregl.Map({
        container: "coordMap",
        center: [18.06, 59.32],
        zoom: 5,
        style: {
            version: 8,
            sources: {
                "osm-tiles": {
                    type: "raster",
                    tiles: [
                        "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                    ],
                    tileSize: 256,
                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }
            },
            layers: [
                {
                    id: "osm-tiles",
                    type: "raster",
                    source: "osm-tiles",
                    minzoom: 0,
                    maxzoom: 19
                }
            ]
        }
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const geocoder = new MaplibreGeocoder(
        {
            forwardGeocode: async (config) => {
                const url =
                    "https://nominatim.openstreetmap.org/search" +
                    "?format=geojson&q=" +
                    encodeURIComponent(config.query);

                const response = await fetch(url);
                const geojson = await response.json();

                return {
                    features: geojson.features.map((feature) => ({
                        type: "Feature",
                        geometry: feature.geometry,
                        place_name: feature.properties.display_name, // ✅ MUST be here
                        properties: {
                            title: feature.properties.display_name
                        }
                    }))
                };
            }
        },
        { maplibregl }
    );

    map.addControl(geocoder, "top-left");

    geocoder.on("result", (e) => {
        const [lngRes, latRes] = e.result.geometry.coordinates;

        map.flyTo({ center: [lngRes, latRes], zoom: 13 });

        if (marker) marker.remove();

        marker = new maplibregl.Marker()
            .setLngLat([lngRes, latRes])
            .addTo(map);

        document.getElementById("cityName").value =
            e.result.place_name || "";
    });

    map.on("click", (e) => {
        lat = e.lngLat.lat.toFixed(6);
        lng = e.lngLat.lng.toFixed(6);

        if (marker) marker.remove();

        marker = new maplibregl.Marker()
            .setLngLat([e.lngLat.lng, e.lngLat.lat])
            .addTo(map);

        document.getElementById("markedCoordinate").value =
            `[ ${document.getElementById("cityName").value} ]( ${lat}, ${lng} )`;
    });

    function copyToClipboard() {
        const text = document.getElementById("markedCoordinate").value;
        navigator.clipboard.writeText(text);
    }

    function updateCoordField() {
        if (lat && lng) {
            document.getElementById("markedCoordinate").value =
                `[ ${document.getElementById("cityName").value} ]( ${lat}, ${lng} )`;
        }
    }

    // Capture Enter in the geocoder input
    document.addEventListener("keydown", (event) => {
        const geocoderInput = document.querySelector(
            ".maplibregl-ctrl-geocoder input"
        );

        if (
            geocoderInput &&
            event.target === geocoderInput &&
            event.key === "Enter"
        ) {
            event.preventDefault();
            document.getElementById("cityName").value = event.target.value;
        }
    });
</script>

</body>
</html>
