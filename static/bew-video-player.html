<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video - Immer in Bewegung</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 900px;
      margin: auto;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      justify-content: center;
    }

    video {
      width: 100%;
      flex-shrink: 0;
      border-radius: 10px;
      max-height: 70%;
    }

    #subtitle-box {
      margin-top: 14px;
      padding: 14px 18px;
      min-height: 48px;
      font-size: 1.2rem;
      background: #111;
      color: #fff;
      border-radius: 8px;
      line-height: 1.4;
    }

    a { color: lightblue; }
  </style>

  <body>
    <div id="container">
      <video id="video" controls>
        <!-- sources -->
      </video>
      <div id="subtitle-box"></div>
    </div>

  <script>
    const video = document.getElementById("video");
    const subtitleBox = document.getElementById("subtitle-box");


    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("video_id");

    // Set video source
    const source = document.createElement("source");
    source.src = `../video/${videoId} (konverterad).mp4`;
    source.type = "video/mp4";
    video.appendChild(source);

    // Track descriptions
    const track1 = document.createElement("track");
    track1.src = `../video/${videoId}.vtt`;
    track1.kind = "subtitles";
    track1.srclang = "sv";
    track1.label = "Svenska";
    track1.default = true;
    video.appendChild(track1);

    // Track for all metadata
    const track2 = document.createElement("track");
    track2.id = "divTrack";
    track2.src = `../video/${videoId}-all-metadata.vtt`;
    track2.kind = "metadata";
    video.appendChild(track2);

    video.addEventListener("loadedmetadata", () => {
      const track = video.textTracks[1]; // second track
      track.mode = "hidden"; // important

      track.addEventListener("cuechange", () => {
        const cues = track.activeCues;
        if (!cues.length) {
          subtitleBox.innerHTML = "";
          return;
        }

        let text = cues[0].text;

        // Regex: matches ±xx.xxx..., ±yy.yyyyyy
        const gpsRegex = /([+-]?\d{1,3}\.\d+)[,\s]+([+-]?\d{1,3}\.\d+)/g;

        // Replace GPS coordinates with Google Maps link
        text = text.replace(gpsRegex, (match, lat, lng) => {
          const url = `https://www.google.com/maps?q=${lat},${lng}`;
          return `<a href="${url}" target="_blank">${lat}, ${lng}</a>`;
        });

        subtitleBox.innerHTML = text;
      });
    });
  </script>

  </body>
</html>
